<div class="login-container">
    <div>
        <h2>Acesso ao sistema de Estoque e Vendas</h2>

        <!-- o (submit) previte o site de recarregar e esta chamando nossa funçao -->
        <form>
            <div class="form-group">
                <label for="username">Usuario: </label>
                <!-- ngmodel esta vinculando automaticamente a função -->
                <input 
                    type="text"
                    id="username"
                    name="username"
                    [(ngModel)]="usuarioDigitado"
                    placeholder="Digite seu usuario"
                    required>
            </div>

            <div class="form-group">
                <label for="password">Senha: </label>
                <input 
                    type="password"
                    id="password"
                    name="password"
                    [(ngModel)]="senhaDigitada"
                    placeholder="Digite sua senha"
                    required>
            </div>
            <!-- Botao para enviar o formulario -->
            <button type="button" (click)="executarLogin()" [disabled]="carregando">
                {{carregando ? 'Entrando...' : 'Entrar'}}
            </button>
        </form> 
    </div>
</div>
